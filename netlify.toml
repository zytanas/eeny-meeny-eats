[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Local development: `netlify dev` starts Vite and proxies it on :8888,
# serving the functions alongside the frontend.
[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 5173
  port = 8888

# API routing: every function sets its own `path` (/api/<name>) in its config, which also
# turns off its default /.netlify/functions/<name> URL, so nothing can skip the limits below.
# Don't rewrite /api/* to /.netlify/functions/:splat: in production a forced rewrite runs
# before function paths and lands on those disabled URLs (every call 404s).
#
# Rate limit only, no rerouting (Netlify's documented "protect your whole site" pattern,
# scoped to /api/*): 60 calls a minute per IP across all of /api. Netlify's Free plan allows
# 2 rate limit rules per project: this one, and 20/min on nearby (nearby.js config).
# Requests to /api/nearby count toward both.
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"

  [redirects.rate_limit]
    window_limit = 60
    window_size = 60
    aggregate_by = ["ip", "domain"]

# SPA fallback so Vue Router routes (e.g. /explore, /place/123) work on refresh.
# Must come after the /api redirect.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
